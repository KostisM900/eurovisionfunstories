<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EurovisionFun Stories</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#0f0a1f; --panel:#1a1233; --panel2:#241947; --line:#34295c;
  --text:#f4f0ff; --muted:#a99fcb; --accent:#F610FF; --accent2:#6C00FF;
  --ok:#2bd17e; --warn:#ffb020; --bad:#ff4d6a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(15,10,31,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{height:26px}
.brand small{font-weight:600;color:var(--muted)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.ok{background:rgba(43,209,126,.14);border-color:rgba(43,209,126,.5)}
.btn.bad{background:rgba(255,77,106,.12);border-color:rgba(255,77,106,.45)}
.btn:disabled{opacity:.5;cursor:default}
.status{color:var(--muted);font-size:13px}
.tabs{max-width:1400px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--text);color:var(--bg);font-weight:700;border-color:var(--text)}
.tab .n{opacity:.7;margin-left:4px}
main{max-width:1400px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card.fresh{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.prev{position:relative;background:#000;aspect-ratio:9/16}
.prev canvas{width:100%;height:100%;display:block}
.prev .pbadge{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.72);padding:6px 9px;border-radius:8px;font-size:12px;line-height:1.35}
.prev .badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700}
.meta{padding:12px 14px 4px}
.meta .t{font-weight:700;line-height:1.3}
.meta .d{color:var(--muted);font-size:12px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.meta a{color:var(--muted)}
.ctrls{padding:8px 14px 14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
select,input[type=text],input[type=url],input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:64px}
label.s{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
input[type=range]{width:100%;accent-color:var(--accent)}
details.edit summary{cursor:pointer;color:var(--muted);font-size:13px;padding:2px 0}
details.edit[open] summary{margin-bottom:6px}
.empty{color:var(--muted);text-align:center;padding:60px 16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:560px;width:calc(100% - 32px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:18px}
.dlg p{margin:0;color:var(--muted);font-size:13px}
.legend{display:grid;gap:8px}
.legend div{display:flex;gap:10px;align-items:center;font-size:13px}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:12px}
pre{background:var(--bg);padding:10px;border-radius:10px;overflow:auto;font-size:12px;margin:0}
@media (max-width:560px){.grid{grid-template-columns:1fr}.brand small{display:none}}
</style>
</head>

function analyse(post){
  const title = post.title;
  const m = title.match(/^([^:]{2,45}):\s*(.+)$/);
  const prefix = m ? m[1].trim() : '';
  const rest = m ? m[2].trim() : title;
  const isCountry = prefix && COUNTRIES.some(c => c.localeCompare(prefix,'el',{sensitivity:'base'})===0);
  const cats = (post.categories||[]).join(' ').toLowerCase();
  let tpl = 'classic';
  if (/breaking|έκτακτο|εκτακτο/i.test(title) || /breaking|έκτακτ/.test(cats)) tpl='breaking';
  else if (/sing for greece/i.test(title) && /(κατέθεσε|καταθέτει|υπέβαλε|υποβάλλει|δήλωσε|δηλώνει).{0,40}συμμετοχ/i.test(title)) tpl='sfg';
  else if (/^(αποκλειστικ[οόa]|exclusive)$/i.test(prefix)) tpl='exclusive';
  else if (m && !isCountry && /^["“«]/.test(rest)) tpl='interview';
  else if (isCountry) tpl='country';
  return {
    tpl,
    country: isCountry ? capsNoTonos(prefix) : '',
    speaker: (!isCountry && m) ? capsNoTonos(prefix) : '',
    stripped: rest,   // τίτλος χωρίς το «Πρόθεμα:»
  };
}
function defaultTitle(post, tpl){
  const a = post.a;
  if (tpl==='country' || tpl==='interview' || tpl==='exclusive') return a.stripped;
  if (tpl==='sfg' && a.country==='ΕΛΛΑΔΑ') return a.stripped;
  if (tpl==='breaking') return post.title.replace(/^\s*(breaking(\s+news)?|έκτακτο|εκτακτο)\s*[:\-–|!]\s*/i,'');
  return post.title;
}

const LS = {

  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const DEFAULTS = {site:'https://eurovisionfun.com', days:3, interval:5, sbUrl:'', sbKey:''};
let settings = Object.assign({}, DEFAULTS, LS.get('efs_settings', {}));
let state = LS.get('efs_state', {});          // id -> {status, tpl, pill, title, y, zoom, ts}
let seen = new Set(LS.get('efs_seen', []));
let posts = [];
let tab = 'todo';
const saveState = () => LS.set('efs_state', state);

/* ---------- Supabase sync (προαιρετικό) ---------- */
const sbOn = () => settings.sbUrl && settings.sbKey;
function sbHeaders(){ return {apikey:settings.sbKey, Authorization:'Bearer '+settings.sbKey, 'Content-Type':'application/json'}; }
async function sbPull(){
  if(!sbOn()) return;
  try{
    const r = await fetch(settings.sbUrl.replace(/\/$/,'')+'/rest/v1/efs_story_state?select=id,data', {headers:sbHeaders()});
    if(!r.ok) throw new Error(r.status);
    for(const row of await r.json()){
      const loc = state[row.id];
      if(!loc || (row.data?.ts||0) > (loc.ts||0)) state[row.id] = row.data;
    }
    saveState();
  }catch(e){ toast('Supabase: δεν έγινε συγχρονισμός ('+e.message+')'); }
}
async function sbPush(id){
  if(!sbOn()) return;
  try{
    await fetch(settings.sbUrl.replace(/\/$/,'')+'/rest/v1/efs_story_state', {
      method:'POST', headers:Object.assign(sbHeaders(), {Prefer:'resolution=merge-duplicates'}),
      body: JSON.stringify([{id:Number(id), data:state[id]}])
    });
  }catch(e){}
}

const STROKE = 2.4;        // πρόσθετο faux bold για να ταιριάξει με το PSD
let FONT = '"EFS Proxima"', WEIGHT = 700, customFont = false;
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('efs',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbDel(k){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
async function idbSet(k,v){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
async function loadFont(buf){
  const ff = new FontFace('EFS Proxima', buf, {weight:'700'});
  await ff.load(); document.fonts.add(ff);
  FONT='"EFS Proxima"'; WEIGHT=700; customFont=true;
}
async function initFont(){
  try{ const ff = new FontFace('EFS Proxima', `url(${EMBED_FONT})`, {weight:'700'}); await ff.load(); document.fonts.add(ff); customFont=true; }catch(e){}
  const buf = await idbGet('font');
  if(buf){ try{ await loadFont(buf); }catch(e){} }
  if(!customFont){
    // Αν το site φορτώνει ήδη Proxima Nova (π.χ. όταν το εργαλείο τρέχει μέσα στο eurovisionfun.com)
    for(const fam of ['Proxima Nova','proxima-nova','ProximaNova-Bold']){
      try{ await document.fonts.load(`700 40px "${fam}"`,'ΑΒ'); if(document.fonts.check(`700 40px "${fam}"`,'ΑΒ')){ FONT=`"${fam}"`; WEIGHT=700; customFont=true; break; } }catch(e){}
    }
  }
  if(!customFont){ FONT='system-ui'; }
  updateFontState();
}
function updateFontState(){
  if(!customFont) toast('Η γραμματοσειρά Proxima Nova δεν φορτώθηκε');
}

/* ---------- images ---------- */
const imgCache = new Map();
function loadImg(src, cors){
  if(imgCache.has(src)) return imgCache.get(src);
  const p = new Promise((res,rej)=>{ const i=new Image(); if(cors) i.crossOrigin='anonymous'; i.decoding='async'; i.onload=()=>res(i); i.onerror=()=>rej(new Error('img')); i.src=src; });
  imgCache.set(src,p); p.catch(()=>imgCache.delete(src)); return p;
}
const ASSETS = {};
async function loadAssets(){ await Promise.all(Object.entries(ASSET_SRC).map(async([k,v])=>{ ASSETS[k]=await loadImg(v); })); }
/* Φόρτωση φωτογραφίας άρθρου με σειρά δοκιμών:
   1) απευθείας (ίδιο site ή αν ο server επιτρέπει CORS) → export OK
   2) μέσω wsrv.nl / images.weserv.nl (CORS proxy) → export OK
   3) απευθείας χωρίς CORS → φαίνεται στην προεπισκόπηση, αλλά ο browser δεν επιτρέπει export */
async function loadPhoto(url){
  const abs = new URL(url, settings.site + '/').href;
  const enc = encodeURIComponent(abs);
  const tries = [
    [abs, true],
    ['https://wsrv.nl/?url=' + enc + '&w=1600&output=jpg&q=90', true],
    ['https://images.weserv.nl/?url=' + enc + '&w=1600&output=jpg&q=90', true],
  ];
  for(const [src,cors] of tries){ try{ return {img: await loadImg(src,cors), exportable:true}; }catch(e){} }
  try{ return {img: await loadImg(abs+(abs.includes('?')?'&':'?')+'nocors=1', false), exportable:false}; }catch(e){}
  throw new Error('photo');
}
/* χειροκίνητη φωτογραφία ανά άρθρο (αποθηκεύεται σε αυτή τη συσκευή) */
async function manualPhoto(id){
  const blob = await idbGet('photo:'+id);
  if(!blob) return null;
  return loadImg(URL.createObjectURL(blob), false);
}

/* ---------- rendering (1080x1920, συντεταγμένες από το PSD) ---------- */
function wrap(ctx, text, maxW){
  const words = text.split(/\s+/); const lines=[]; let cur='';
  for(const w of words){
    const t = cur ? cur+' '+w : w;
    if(ctx.measureText(t).width <= maxW || !cur) cur=t; else { lines.push(cur); cur=w; }
  }
  if(cur) lines.push(cur);
  return lines;
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fauxBold(ctx, text, x, y, color, amt){
  ctx.fillStyle=color; ctx.fillText(text,x,y);
  ctx.strokeStyle=color; ctx.lineWidth=STROKE*amt; if(!ctx.lineWidth) return; ctx.lineJoin='round'; ctx.strokeText(text,x,y);
}

function render(canvas, post, st, photo){
  const ctx = canvas.getContext('2d');
  const T = TEMPLATES[st.tpl] || TEMPLATES.classic;
  ctx.setTransform(1,0,0,1,0,0);
  if('letterSpacing' in ctx) ctx.letterSpacing='1px';
  ctx.clearRect(0,0,1080,1920);
  ctx.fillStyle='#3d0099'; ctx.fillRect(0,0,1080,1920);

  // φωτογραφία άρθρου: cover στην πάνω ζώνη (PSD: 0–960)
  if(photo){
    const BH = 990, z = st.zoom || 1;
    const s = Math.max(1080/photo.naturalWidth, BH/photo.naturalHeight) * z;
    const dw = photo.naturalWidth*s, dh = photo.naturalHeight*s;
    const dx = (1080-dw)/2, dy = (BH-dh) * (st.y ?? 0.35);
    ctx.drawImage(photo, dx, dy, dw, dh);
  }
  ctx.drawImage(ASSETS.gradient, 0, 602, 1080, 1318);
  ctx.drawImage(ASSETS[T.frame], -22, -39, 1124, 1998);
  ctx.drawImage(ASSETS.logo, 481, 1608, 117, 56);

  // pill
  let pf = 49.6;
  const pillText = (st.pill ?? T.pill(post.a.__p)).trim();
  if(pillText){
    ctx.font = `${WEIGHT} ${pf}px ${FONT}, sans-serif`;
    let tw = ctx.measureText(pillText).width;
    while(tw > 720 && pf > 30){ pf -= 1; ctx.font = `${WEIGHT} ${pf}px ${FONT}, sans-serif`; tw = ctx.measureText(pillText).width; }
    const w = tw + 70;
    ctx.fillStyle = T.pillBg; rr(ctx,144,820,w,60,30); ctx.fill();
    ctx.textBaseline='alphabetic';
    const capH = ctx.measureText('ΗΕ').actualBoundingBoxAscent || pf*0.7;
    fauxBold(ctx, pillText, 144+(w-tw)/2, 850 + capH/2, T.pillFg, 1.2);
  }

  // τίτλος
  const title = (st.title ?? defaultTitle(post, st.tpl)).trim();
  let fs = 65, lines;
  for(;;){
    ctx.font = `${WEIGHT} ${fs}px ${FONT}, sans-serif`;
    lines = wrap(ctx, title, 690);
    if(lines.length <= 5 || fs <= 50) break;
    fs -= 2;
  }
  const lead = fs*60/65;  // PSD: 65px / leading 60px (Proxima)
  const first = 929 + (ctx.measureText('ΗΕ').actualBoundingBoxAscent || fs*0.66);
  lines.forEach((l,i)=> fauxBold(ctx, l, 147, first + i*lead, '#ffffff', 1.4));
  const last = first + (lines.length-1)*lead;

  // διακριτικό σταυρός (PSD)
  const hTop = Math.round(last + 124);
  ctx.fillStyle='#ffffff';
  ctx.fillRect(146, hTop, 454, 13);
  ctx.fillRect(365, hTop-42, 14, 88);

  if(st.tpl==='interview'){
    ctx.font = `${WEIGHT} 300px ${FONT}, sans-serif`;
    ctx.fillStyle = 'rgba(246,16,255,.9)';
    ctx.fillText('”', 845, 1170 + Math.max(0, lines.length-3)*lead);
  }
}

/* ---------- data ---------- */
function setStatus(t){ document.getElementById('status').textContent=t; }
async function fetchPosts(){
  const base = settings.site.replace(/\/$/,'');
  const after = new Date(Date.now() - settings.days*864e5).toISOString().slice(0,19);
  const url = `${base}/wp-json/wp/v2/posts?per_page=50&after=${after}&_embed=wp:featuredmedia,wp:term&orderby=date&order=desc`;
  try{
    const r = await fetch(url, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    return data.map(p => {
      const media = p._embedded?.['wp:featuredmedia']?.[0];
      const sizes = media?.media_details?.sizes || {};
      const img = (sizes.full||sizes['1536x1536']||sizes.large||{}).source_url || media?.source_url
        || p.yoast_head_json?.og_image?.[0]?.url || p.jetpack_featured_media_url
        || (p.content?.rendered||'').match(/<img[^>]+src=["']([^"']+)["']/)?.[1] || null;
      const cats = (p._embedded?.['wp:term']?.[0]||[]).map(c=>decode(c.name));
      return {id:String(p.id), title:decode(p.title.rendered), link:p.link, date:p.date, img, categories:cats};
    });
  }catch(e){
    // εφεδρικά: RSS feed (λειτουργεί όταν το εργαλείο τρέχει μέσα στο ίδιο site)
    const r = await fetch(`${base}/feed/`, {cache:'no-store'});
    if(!r.ok) throw e;
    const xml = new DOMParser().parseFromString(await r.text(),'text/xml');
    return [...xml.querySelectorAll('item')].map(it=>{
      const html = it.getElementsByTagName('content:encoded')[0]?.textContent || it.querySelector('description')?.textContent || '';
      const img = it.getElementsByTagName('media:content')[0]?.getAttribute('url') || it.querySelector('enclosure')?.getAttribute('url') || (html.match(/<img[^>]+src="([^"]+)"/)||[])[1] || null;
      const guid = it.querySelector('guid')?.textContent || it.querySelector('link')?.textContent;
      const id = (guid.match(/[?&]p=(\d+)/)||[])[1] || guid;
      return {id:String(id), title:decode(it.querySelector('title')?.textContent||''), link:it.querySelector('link')?.textContent, date:new Date(it.querySelector('pubDate')?.textContent).toISOString(), img, categories:[...it.querySelectorAll('category')].map(c=>c.textContent)};
    }).filter(p => Date.now()-new Date(p.date) < settings.days*864e5);
  }
}

let busy=false;
async function refresh(manual){
  if(busy) return; busy=true;
  document.getElementById('refreshBtn').disabled=true;
  setStatus('Ανανέωση…');
  try{
    await sbPull();
    const list = await fetchPosts();
    const fresh = list.filter(p => !seen.has(p.id));
    const firstRun = seen.size===0;
    list.forEach(p => { p.a = analyse(p); p.a.__p = {title:p.title, country:p.a.country, speaker:p.a.speaker}; p.isFresh = !firstRun && fresh.some(f=>f.id===p.id); });
    posts = list;
    list.forEach(p=>seen.add(p.id)); LS.set('efs_seen', [...seen].slice(-1000));
    const t = new Date().toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});
    setStatus(`Τελευταία ανανέωση ${t} · ${list.length} άρθρα`);
    if(!firstRun && fresh.length){
      toast(fresh.length===1 ? 'Νέο άρθρο: '+fresh[0].title : fresh.length+' νέα άρθρα');
      notify(fresh);
    }
    draw();
  }catch(e){
    setStatus('Σφάλμα ανανέωσης');
    showEmpty(`Δεν ήταν δυνατή η ανάγνωση άρθρων από <b>${esc(settings.site)}</b> (${esc(e.message)}).<br><br>Αν το εργαλείο τρέχει εκτός eurovisionfun.com, το site πρέπει να επιτρέπει πρόσβαση στο <code>/wp-json/wp/v2/posts</code>. Η πιο σίγουρη λύση είναι να ανέβει το αρχείο μέσα στο ίδιο το site.`);
  }finally{ busy=false; document.getElementById('refreshBtn').disabled=false; }
}

function notify(fresh){
  try{
    if('Notification' in window && Notification.permission==='granted'){
      const n = new Notification('EurovisionFun · νέο άρθρο', {body: fresh.map(f=>f.title).join('\n'), icon: ASSET_SRC.logo});
      n.onclick=()=>window.focus();
    }
  }catch(e){}
}

/* ---------- UI ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stOf(p){
  const s = state[p.id] || {};
  return {status:s.status||'todo', tpl:s.tpl||p.a.tpl, pill:s.pill, title:s.title, y:s.y, zoom:s.zoom};
}
function patch(id, obj, push){
  state[id] = Object.assign({}, state[id], obj, {ts:Date.now()});
  saveState(); if(push) sbPush(id);
}
const TABS = [['todo','Για ανέβασμα'],['posted','Ανέβηκαν'],['hidden','Κρυμμένα']];
function drawTabs(){
  const counts = {todo:0,posted:0,hidden:0};
  posts.forEach(p=>counts[stOf(p).status]++);
  document.getElementById('tabs').innerHTML = TABS.map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-tab="${k}">${l}<span class="n">${counts[k]}</span></button>`).join('');
  document.title = (counts.todo? `(${counts.todo}) `:'') + 'EurovisionFun Stories';
}
function showEmpty(html){ const e=document.getElementById('empty'); e.innerHTML=html; e.hidden=false; document.getElementById('grid').innerHTML=''; }

function draw(){
  drawTabs();
  const grid = document.getElementById('grid'), empty=document.getElementById('empty');
  const list = posts.filter(p=>stOf(p).status===tab);
  if(!list.length){ showEmpty(tab==='todo' ? 'Όλα τα νέα άρθρα έχουν τακτοποιηθεί. 🎉' : 'Τίποτα εδώ ακόμα.'); return; }
  empty.hidden=true;
  grid.innerHTML = list.map(p=>{
    const s=stOf(p);
    const opts = Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}" ${k===s.tpl?'selected':''}>${t.name}${k===p.a.tpl?' · αυτόματο':''}</option>`).join('');
    const d = new Date(p.date).toLocaleString('el-GR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    const actions = s.status==='todo'
      ? `<button class="btn ok" data-act="posted">✓ Το ανέβασα</button><button class="btn bad" data-act="hidden">✕ Δεν θα ανέβει</button>`
      : `<button class="btn" data-act="todo">↩︎ Επαναφορά</button>`;
    return `<article class="card ${p.isFresh&&s.status==='todo'?'fresh':''}" data-id="${esc(p.id)}">
      <div class="prev"><canvas width="1080" height="1920"></canvas>${p.isFresh&&s.status==='todo'?'<span class="badge">ΝΕΟ</span>':''}<span class="pbadge" hidden></span></div>
      <div class="meta"><div class="t">${esc(p.title)}</div><div class="d"><span>${d}</span><a href="${esc(p.link)}" target="_blank" rel="noopener">άνοιγμα άρθρου ↗</a></div></div>
      <div class="ctrls">
        <select data-f="tpl">${opts}</select>
        <details class="edit"><summary>Επεξεργασία κειμένου & φωτογραφίας</summary>
          <div style="display:flex;flex-direction:column;gap:8px">
            <div><label class="s">Ετικέτα (κεφαλαία χωρίς τόνους)</label><input type="text" data-f="pill" value="${esc(s.pill ?? TEMPLATES[s.tpl].pill(p.a.__p))}"></div>
            <div><label class="s">Τίτλος στο story</label><textarea data-f="title">${esc(s.title ?? defaultTitle(p,s.tpl))}</textarea></div>
            <div class="row"><div><label class="s">Θέση φωτογραφίας</label><input type="range" min="0" max="1" step="0.01" data-f="y" value="${s.y ?? 0.35}"></div>
            <div><label class="s">Zoom</label><input type="range" min="1" max="2" step="0.01" data-f="zoom" value="${s.zoom ?? 1}"></div></div>
            <label class="btn" style="text-align:center">📷 Δική μου φωτογραφία<input type="file" accept="image/*" data-photo hidden></label>
            <button class="btn" data-act="reset" type="button">Επαναφορά αυτόματων</button>
          </div>
        </details>
        <div class="row"><button class="btn primary" data-act="png">⬇︎ PNG</button><button class="btn" data-act="share">Κοινοποίηση</button><button class="btn" data-act="link">🔗 Link</button></div>
        <div class="row">${actions}</div>
      </div>
    </article>`;
  }).join('');
  grid.querySelectorAll('.card').forEach(paint);
}

async function paint(card){
  const p = posts.find(x=>x.id===card.dataset.id); if(!p) return;
  const cv = card.querySelector('canvas');
  const s = stOf(p);
  render(cv, p, s, null);
  const badge = card.querySelector('.pbadge');
  const say = t => { badge.textContent = t; badge.hidden = !t; };
  card._photo = null; card._exportable = true;
  const man = await manualPhoto(p.id).catch(()=>null);
  if(man){ card._photo = man; render(cv, p, stOf(p), man); say(''); return; }
  if(!p.img){ say('Το άρθρο δεν έχει φωτογραφία — πρόσθεσε μία από «Επεξεργασία» → 📷'); return; }
  try{
    const r = await loadPhoto(p.img);
    card._photo = r.img; card._exportable = r.exportable;
    render(cv, p, stOf(p), r.img);
    say(r.exportable ? '' : 'Η φωτογραφία φαίνεται, αλλά ο browser δεν επιτρέπει να βγει PNG. Πρόσθεσέ τη από «Επεξεργασία» → 📷.');
  }catch(e){
    say('Η φωτογραφία δεν φορτώθηκε — πρόσθεσέ τη από «Επεξεργασία» → 📷');
  }
}
function repaint(card){ const p=posts.find(x=>x.id===card.dataset.id); render(card.querySelector('canvas'), p, stOf(p), card._photo||null); }

function exportBlob(card){
  return new Promise((res,rej)=>{
    try{ card.querySelector('canvas').toBlob(b=> b?res(b):rej(new Error('blob')), 'image/png'); }catch(e){ rej(e); }
  });
}
function fileName(p){ return 'efun-story-'+p.id+'.png'; }

document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-tab]');
  if(t){ tab=t.dataset.tab; draw(); window.scrollTo({top:0}); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const card = b.closest('.card'); const p = posts.find(x=>x.id===card?.dataset.id); if(!p) return;
  const act = b.dataset.act;
  if(act==='posted'||act==='hidden'||act==='todo'){
    patch(p.id, {status:act}, true);
    toast(act==='posted'?'Σημειώθηκε ως ανεβασμένο':act==='hidden'?'Κρύφτηκε':'Επανήλθε');
    card.style.transition='opacity .2s'; card.style.opacity='0';
    setTimeout(draw, 180);
  } else if(act==='reset'){
    const keep = state[p.id]?.status; state[p.id] = {status:keep, ts:Date.now()}; saveState(); sbPush(p.id);
    await idbDel('photo:'+p.id); draw();
  } else if(act==='png'){
    try{ const blob = await exportBlob(card); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fileName(p); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
    catch(err){ toast('Δεν βγαίνει PNG με αυτή τη φωτογραφία — βάλε τη χειροκίνητα (📷)'); }
  } else if(act==='share'){
    try{
      const blob = await exportBlob(card); const file = new File([blob], fileName(p), {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]});
      else toast('Η κοινοποίηση αρχείων υποστηρίζεται σε κινητό — χρησιμοποίησε το PNG');
    }catch(err){ if(err.name!=='AbortError') toast('Η κοινοποίηση δεν ολοκληρώθηκε'); }
  } else if(act==='link'){
    try{ await navigator.clipboard.writeText(p.link); toast('Το link αντιγράφηκε — για το link sticker'); }catch(err){ prompt('Link άρθρου:', p.link); }
  }
});

document.addEventListener('change', async e=>{
  if(!e.target.matches('[data-photo]')) return;
  const f = e.target.files[0]; if(!f) return;
  const card = e.target.closest('.card');
  await idbSet('photo:'+card.dataset.id, f);
  paint(card); toast('Η φωτογραφία μπήκε');
});
let tmr={};
document.addEventListener('input', e=>{
  const f = e.target.dataset?.f; if(!f) return;
  const card = e.target.closest('.card'); const p = posts.find(x=>x.id===card.dataset.id);
  let v = e.target.value;
  if(f==='y'||f==='zoom') v = parseFloat(v);
  if(f==='tpl'){
    // νέο template: οι αυτόματες τιμές ετικέτας/τίτλου ξαναϋπολογίζονται
    patch(p.id, {tpl:v, pill:undefined, title:undefined}, true);
    const s=stOf(p);
    card.querySelector('[data-f=pill]').value = TEMPLATES[v].pill(p.a.__p);
    card.querySelector('[data-f=title]').value = defaultTitle(p, v);
    repaint(card); return;
  }
  if(f==='pill') v = capsNoTonos(v);
  patch(p.id, {[f]:v}, false);
  repaint(card);
  clearTimeout(tmr[p.id]); tmr[p.id]=setTimeout(()=>sbPush(p.id), 800);
});
document.addEventListener('change', e=>{ if(e.target.dataset?.f==='pill'){ e.target.value = capsNoTonos(e.target.value); } });

let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600); }

/* ---------- settings ---------- */
const dlg = document.getElementById('settings');
document.getElementById('legend').innerHTML = '<p>Αυτόματη επιλογή design:</p>' + [
  ['breaking','τίτλος με «Breaking» / «Έκτακτο» ή αντίστοιχη κατηγορία'],
  ['sfg','«κατέθεσε / δήλωσε συμμετοχή» + «Sing for Greece»'],
  ['interview','«Όνομα: “δήλωση”»'],
  ['country','τίτλος που ξεκινά με χώρα, π.χ. «Ουκρανία: …» → η χώρα πάει στην ετικέτα'],
  ['classic','όλα τα υπόλοιπα'],
].map(([k,t])=>`<div><span class="sw" style="background:${TEMPLATES[k].sw}"></span><b>${TEMPLATES[k].name}</b>&nbsp;— ${t}</div>`).join('');
document.getElementById('settingsBtn').onclick = ()=>{
  sSite.value=settings.site; sDays.value=settings.days; sInterval.value=String(settings.interval);
  sSbUrl.value=settings.sbUrl; sSbKey.value=settings.sbKey; dlg.showModal();
};
document.getElementById('saveSettings').onclick = ()=>{
  settings = {site:sSite.value.trim()||DEFAULTS.site, days:Math.max(1,parseInt(sDays.value)||3), interval:parseInt(sInterval.value), sbUrl:sSbUrl.value.trim(), sbKey:sSbKey.value.trim()};
  LS.set('efs_settings', settings); schedule(); refresh(true);
};
document.getElementById('notifBtn').onclick = async ()=>{
  if(!('Notification' in window)) return toast('Ο browser δεν υποστηρίζει ειδοποιήσεις');
  const r = await Notification.requestPermission();
  toast(r==='granted' ? 'Θα ειδοποιείσαι όσο το εργαλείο είναι ανοιχτό' : 'Οι ειδοποιήσεις δεν επιτράπηκαν');
};
document.getElementById('refreshBtn').onclick = ()=>refresh(true);

let iv;
function schedule(){ clearInterval(iv); if(settings.interval>0) iv=setInterval(()=>refresh(false), settings.interval*60000); }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(false); });

(async()=>{
  const q = new URLSearchParams(location.search);
  if(q.get('site')) settings.site = q.get('site');
  await Promise.all([loadAssets(), initFont()]);
  await refresh(true);
  schedule();
})();
})();
</script>
