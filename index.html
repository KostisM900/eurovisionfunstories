:root{
  --bg:#0d0420; --bg2:#14082e; --card:#1b0d3a; --card2:#241249; --line:rgba(255,255,255,.09);
  --text:#f6f2ff; --muted:#a698cc; --dim:#75699a;
  --mag:#F610FF; --vio:#6C00FF; --ok:#22d38a; --red:#ff4867;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.45 "EFS Proxima",-apple-system,system-ui,"Segoe UI",sans-serif;min-height:100vh;
  background:radial-gradient(120% 60% at 50% -10%,#3a0d7a 0%,rgba(58,13,122,0) 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button,label.btn{user-select:none;-webkit-user-select:none}
svg{display:block}
code{font-size:12px}

.top{position:sticky;top:0;z-index:30;padding:calc(var(--safe-t) + 8px) 14px 10px;
  background:rgba(13,4,32,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto}
.row1{display:flex;align-items:center;gap:10px}
.logo{height:22px}
.ttl{font-weight:700;font-size:16px;line-height:1.1;padding-left:10px;border-left:1px solid var(--line)}
.ttl small{display:block;font-size:11px;color:var(--dim);font-weight:700;margin-top:2px}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;flex:none;color:var(--muted)}
.ib:active{transform:scale(.94)}
.ib svg{width:17px;height:17px}
.ib.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{margin-top:10px;display:flex;gap:4px;background:rgba(255,255,255,.05);border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:rgba(255,255,255,.12);color:var(--text)}
.seg .n{font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.08);display:inline-grid;place-items:center;color:var(--muted)}
.seg button.on .n{background:var(--mag);color:#fff}

main{max-width:980px;margin:0 auto;padding:12px 14px calc(32px + var(--safe-b))}
.feed{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.feed{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;transition:opacity .25s,transform .25s}
.card.fresh{border-color:rgba(246,16,255,.45)}
.card.out{opacity:0;transform:translateX(-12px)}
.row{display:flex;gap:12px}
.thumb{flex:none;width:104px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;border:0;padding:0;background:#1a0a3a;position:relative;box-shadow:0 8px 20px -10px rgba(108,0,255,.7)}
.thumb canvas{width:100%;height:100%;display:block}
.thumb .zoom{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:7px;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}
.thumb .zoom svg{width:12px;height:12px}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);font-weight:700;flex-wrap:wrap}
.new{background:var(--mag);color:#fff;border-radius:5px;padding:1px 6px;font-size:10px;letter-spacing:.05em}
.tag{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.tag i{width:7px;height:7px;border-radius:50%}
.t{margin:6px 0 0;font-size:14.5px;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.note{margin-top:6px;font-size:11.5px;line-height:1.3;color:#ffc24d;display:flex;gap:5px;align-items:flex-start}
.note[hidden]{display:none}
.note svg{width:13px;height:13px;flex:none;margin-top:1px}
.acts{margin-top:auto;padding-top:10px;display:grid;grid-template-columns:1fr auto;gap:6px}
.btn{height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13.5px;padding:0 12px;white-space:nowrap;min-width:0}
.btn svg{width:16px;height:16px;flex:none}
.btn:active{transform:scale(.97);filter:brightness(1.15)}
.btn.wait{pointer-events:none;opacity:.7}
.btn.wait svg{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.25;transform:translateY(2px)}}
.btn.pri{background:linear-gradient(135deg,var(--mag),#a100ff);border:0;color:#fff}
.foot{display:flex;align-items:center;gap:2px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.gh{border:0;background:transparent;height:32px;padding:0 9px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;text-decoration:none}
.gh svg{width:14px;height:14px}
.gh:active,.gh.on{background:rgba(255,255,255,.08);color:var(--text)}
.gh.ok{color:#5fe3a8}
.gh .chev{transition:transform .2s}
.gh.on .chev{transform:rotate(180deg)}

.edit{display:none;margin-top:8px;padding-top:10px;border-top:1px solid var(--line);gap:12px;flex-direction:column}
.edit.open{display:flex}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -10px;padding:0 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px 6px 9px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip.on{background:#fff;color:#16072f;border-color:#fff}
.chip .auto{font-size:9.5px;opacity:.55;letter-spacing:.04em}
.lbl{font-size:11.5px;color:var(--dim);font-weight:700;margin:0 0 4px 2px;display:block}
.inp{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px}
textarea.inp{resize:vertical;min-height:70px;line-height:1.35}
.inp:focus{outline:2px solid var(--mag);outline-offset:-1px}
select.inp{appearance:none;-webkit-appearance:none}
.rng{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=range]{width:100%;accent-color:var(--mag);height:24px;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.sm{height:36px;font-size:13px}

.empty{text-align:center;color:var(--muted);padding:60px 20px;max-width:380px;margin:0 auto;line-height:1.5;font-size:14px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.empty .big{font-size:34px;margin-bottom:6px}
.skel{height:232px;border-radius:18px;background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);background-size:300% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-150% 0}}

.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#fff;color:#16072f;border-radius:13px;padding:10px 10px 10px 14px;font-weight:700;font-size:13.5px;z-index:60;display:flex;align-items:center;gap:14px;
  box-shadow:0 14px 40px -10px rgba(0,0,0,.6);transition:.22s;max-width:calc(100% - 28px);width:max-content}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:#16072f;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;flex:none}
.toast button[hidden]{display:none}

dialog{border:0;padding:0;background:transparent;color:var(--text);max-width:560px;width:100%;margin:auto auto 0;max-height:92vh}
@media (min-width:700px){dialog{margin:auto}}
dialog::backdrop{background:rgba(5,0,15,.65);backdrop-filter:blur(4px)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
@media (min-width:700px){.sheet{border-radius:26px}}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto}
.sheet h2{margin:0;font-size:18px}
.sheet p{margin:0;color:var(--muted);font-size:13px}
.legend{display:flex;flex-direction:column;gap:9px}
.legend div{display:flex;gap:10px;font-size:13px;color:var(--muted);align-items:flex-start}
.legend b{color:var(--text)}
.legend i{width:12px;height:12px;border-radius:50%;flex:none;margin-top:3px}
.file{display:flex;align-items:center;gap:10px}
.file img{height:44px;max-width:120px;object-fit:contain;background:rgba(255,255,255,.08);border-radius:8px;padding:4px}
.file img[hidden],.file [hidden]{display:none}
details summary{cursor:pointer;font-weight:700}
.view{position:fixed;inset:0;z-index:80;background:rgba(5,0,15,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 16px)}
.view[hidden]{display:none}
.view img{max-width:100%;max-height:calc(100vh - 210px);border-radius:16px;box-shadow:0 20px 60px -20px #000;-webkit-touch-callout:default;user-select:auto}
.view p{margin:0;color:var(--muted);font-size:13.5px;text-align:center;max-width:340px;line-height:1.4}
.view .vb{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:340px}
.view .btn{height:44px;font-size:14.5px}
</style>
</head>

function analyse(post){
  const title = post.title;
  const m = title.match(/^([^:]{2,45}):\s*(.+)$/);
  const prefix = m ? m[1].trim() : '';
  const rest = m ? m[2].trim() : title;
  const isCountry = !!prefix && COUNTRIES.some(c => c.localeCompare(prefix,'el',{sensitivity:'base'})===0);
  const cats = (post.categories||[]).join(' ').toLowerCase();
  let tpl = 'classic';
  if (/^(breaking(\s+news)?|έκτακτο|εκτακτο)$/i.test(prefix) || /\bbreaking\b/i.test(title) || /breaking|έκτακτ/.test(cats)) tpl='breaking';
  else if (/^live$/i.test(prefix) || /\blive\s*(blog|ενημέρωση)|ζωντανή ενημέρωση/i.test(title)) tpl='live';
  else if (/sing for greece/i.test(title) && /(κατέθεσε|καταθέτει|υπέβαλε|υποβάλλει|δήλωσε|δηλώνει).{0,40}συμμετοχ/i.test(title)) tpl='sfg';
  else if (/^(αποκλειστικ[οό]|exclusive)$/i.test(prefix)) tpl='exclusive';
  else if (m && !isCountry && /^["“«]/.test(rest)) tpl='interview';
  else if (isCountry) tpl='country';
  const d = new Date(post.date);
  return {tpl, prefix, rest, hasPrefix:!!m, title,
    country: isCountry ? capsNoTonos(prefix) : '',
    speaker: (!isCountry && m) ? capsNoTonos(prefix) : '',
    year: String(d.getFullYear() + (d.getMonth() >= 5 ? 1 : 0))};
}
function defaultTitle(post, tpl){
  const a = post.a;
  if (a.hasPrefix && (tpl==='breaking' || tpl==='live')) return /^(breaking(\s+news)?|έκτακτο|εκτακτο|live)$/i.test(a.prefix) ? a.rest : post.title;
  if (a.hasPrefix && ['country','interview','exclusive'].includes(tpl)) return a.rest;   // η ετικέτα λέει ήδη το «πρόθεμα»
  if (tpl==='sfg' && a.country==='ΕΛΛΑΔΑ') return a.rest;
  return post.title;
}

function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('efs',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
async function idbDel(k){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }

/* ---------- Supabase (προαιρετικό) ---------- */
const sbOn = () => settings.sbUrl && settings.sbKey;
const sbH = () => ({apikey:settings.sbKey, Authorization:'Bearer '+settings.sbKey, 'Content-Type':'application/json'});
async function sbPull(){
  if(!sbOn()) return;
  try{
    const r = await fetch(settings.sbUrl.replace(/\/$/,'')+'/rest/v1/efs_story_state?select=id,data', {headers:sbH()});
    if(!r.ok) throw new Error(r.status);
    for(const row of await r.json()){ const l=state[row.id]; if(!l || (row.data?.ts||0) > (l.ts||0)) state[row.id]=row.data; }
    saveState();
  }catch(e){ toast('Supabase: δεν έγινε συγχρονισμός'); }
}
async function sbPush(id){
  if(!sbOn()) return;
  try{ await fetch(settings.sbUrl.replace(/\/$/,'')+'/rest/v1/efs_story_state', {method:'POST', headers:Object.assign(sbH(),{Prefer:'resolution=merge-duplicates'}), body:JSON.stringify([{id:Number(id), data:state[id]}])}); }catch(e){}
}

/* ---------- images ---------- */
const imgCache = new Map();
function loadImg(src, cors){
  const key = (cors?'c:':'n:')+src;
  if(imgCache.has(key)) return imgCache.get(key);
  const p = new Promise((res,rej)=>{ const i=new Image(); if(cors) i.crossOrigin='anonymous'; i.decoding='async'; i.onload=()=>res(i); i.onerror=()=>rej(new Error('img')); i.src=src; });
  imgCache.set(key,p); p.catch(()=>imgCache.delete(key)); return p;
}
const ASSETS = {};
let SFG_LOGO = null;
async function loadAssets(){
  await Promise.all(Object.entries(ASSET_SRC).map(async([k,v])=>{ ASSETS[k]=await loadImg(v,false); }));
  const blob = await idbGet('sfglogo');
  if(blob) SFG_LOGO = await loadImg(URL.createObjectURL(blob), false).catch(()=>null);
  else if(SFG_LOGO_EMBED.startsWith('data:')) SFG_LOGO = await loadImg(SFG_LOGO_EMBED, false).catch(()=>null);
}
/* Φωτογραφία άρθρου: 1) απευθείας με άδεια CORS (ίδιο site ή .htaccess) 2) wsrv.nl proxy
   3) όπως ένα απλό <img> — φαίνεται, αλλά ο browser δεν επιτρέπει export PNG              */
// Δικός σας proxy στο Supabase (edge function «efs-image»): φέρνει μόνο εικόνες του eurovisionfun.com με άδεια CORS
const IMG_PROXY = 'https://bmdwlckzzpxjjfcvyiui.supabase.co/functions/v1/efs-image';
async function loadPhoto(url){
  const abs = new URL(url, settings.site + '/').href, enc = encodeURIComponent(abs);
  for(const src of [abs, IMG_PROXY+'?url='+enc, 'https://wsrv.nl/?url='+enc+'&w=1600&output=jpg&q=90']){
    try{ return {img: await loadImg(src,true), exportable:true}; }catch(e){}
  }
  return {img: await loadImg(abs,false), exportable:false};
}
async function manualPhoto(id){ const b = await idbGet('photo:'+id); return b ? loadImg(URL.createObjectURL(b), false) : null; }

/* ---------- rendering 1080×1920 ---------- */
const FONT = '"EFS Proxima", sans-serif', STROKE = 2.4;
function wrap(ctx, text, maxW){
  const words = text.split(/\s+/); const lines=[]; let cur='';
  for(const w of words){ const t = cur ? cur+' '+w : w; if(ctx.measureText(t).width <= maxW || !cur) cur=t; else { lines.push(cur); cur=w; } }
  if(cur) lines.push(cur);
  // να μη μένει μόνη της μικρή λέξη στην τελευταία γραμμή
  if(lines.length>1){
    const L=lines.length, last=lines[L-1];
    if(last.length<=4 && !/\s/.test(last)){
      const prev=lines[L-2].split(' ');
      if(prev.length>2){ const mv=prev.pop(); if(ctx.measureText(mv+' '+last).width<=maxW){ lines[L-2]=prev.join(' '); lines[L-1]=mv+' '+last; } }
    }
  }
  return lines;
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function boldText(ctx, text, x, y, color, amt){
  ctx.fillStyle=color; ctx.fillText(text,x,y);
  ctx.strokeStyle=color; ctx.lineWidth=STROKE*amt; ctx.lineJoin='round'; if(ctx.lineWidth) ctx.strokeText(text,x,y);   // faux bold όπως στο PSD
}
function render(canvas, post, st, photo){
  const ctx = canvas.getContext('2d');
  const T = TEMPLATES[st.tpl] || TEMPLATES.classic;
  ctx.setTransform(1,0,0,1,0,0);
  if('letterSpacing' in ctx) ctx.letterSpacing='1px';
  ctx.textBaseline='alphabetic';
  ctx.fillStyle = st.tpl==='sfg' ? '#0a2a9a' : '#3d0099'; ctx.fillRect(0,0,1080,1920);

  if(photo){
    const BH = 1000, z = st.zoom || 1;
    const s = Math.max(1080/photo.naturalWidth, BH/photo.naturalHeight) * z;
    const dw = photo.naturalWidth*s, dh = photo.naturalHeight*s;
    ctx.drawImage(photo, (1080-dw)/2, (BH-dh) * (st.y ?? 0.3), dw, dh);
  }
  ctx.drawImage(ASSETS[T.grad], 0, 602, 1080, 1318);
  for(const [x,y,r,c] of (T.glow||[])){
    const g = ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,c); g.addColorStop(1,c.replace(/[\d.]+\)$/,'0)'));
    ctx.fillStyle=g; ctx.fillRect(0,600,1080,1320);
  }
  ctx.drawImage(ASSETS[T.frame], -22, -39, 1124, 1998);

  if(T.sfgLogo && SFG_LOGO){
    ctx.drawImage(ASSETS.logo, 141, 1608, 117, 56);
    // ίδιο μέγεθος/θέση με το πρότυπο: πλάτος ~265px, δεξιά στοίχιση στο 940, κέντρο στο ύψος του logo EurovisionFun
    let w = 265, h = w * SFG_LOGO.naturalHeight / SFG_LOGO.naturalWidth;
    if(h > 130){ w = w*130/h; h = 130; }
    ctx.drawImage(SFG_LOGO, 940 - w, 1636 - h/2, w, h);
  } else ctx.drawImage(ASSETS.logo, 481, 1608, 117, 56);

  const Y = T.pillY;
  const pillText = (st.pill ?? T.pill(post.a)).trim();
  if(pillText){
    let pf = 49.6;
    ctx.font = `700 ${pf}px ${FONT}`;
    let tw = ctx.measureText(pillText).width;
    while(tw > 720 && pf > 30){ pf -= 1; ctx.font = `700 ${pf}px ${FONT}`; tw = ctx.measureText(pillText).width; }
    const dotW = T.liveDot ? 34 : 0;
    const w = tw + 70 + dotW;
    ctx.fillStyle = T.pillBg; rr(ctx,144,Y,w,60,30); ctx.fill();
    if(T.liveDot){ ctx.fillStyle=T.pillFg; ctx.beginPath(); ctx.arc(144+40, Y+30, 10, 0, 7); ctx.fill(); }
    const capH = ctx.measureText('ΗΕ').actualBoundingBoxAscent || pf*0.7;
    boldText(ctx, pillText, 144+35+dotW, Y+30+capH/2, T.pillFg, 1.2);
  }

  const title = (st.title ?? defaultTitle(post, st.tpl)).trim();
  let fs = 65, lines;
  const maxW = T.quote ? 640 : (T.pillY===922 ? 825 : 690);   // Breaking/SFG πρότυπα: πιο φαρδύ πλαίσιο κειμένου
  for(;;){ ctx.font = `700 ${fs}px ${FONT}`; lines = wrap(ctx, title, maxW); if(lines.length <= 5 || fs <= 50) break; fs -= 2; }
  const lead = fs*60/65;
  const first = Y + 109 + (ctx.measureText('ΗΕ').actualBoundingBoxAscent || fs*0.66);
  lines.forEach((l,i)=> boldText(ctx, l, 147, first + i*lead, '#ffffff', 1.4));
  const last = first + (lines.length-1)*lead;

  if(T.cross){
    const hTop = Math.round(last + 124);
    ctx.fillStyle='#ffffff'; ctx.fillRect(146, hTop, 454, 13); ctx.fillRect(365, hTop-42, 14, 88);
  }
  if(T.quote){
    ctx.font = `700 280px ${FONT}`; ctx.fillStyle = 'rgba(246,16,255,.95)';
    ctx.fillText('”', 830, first + 150);
  }
}

/* ---------- data ---------- */
async function fetchPosts(){
  const base = settings.site.replace(/\/$/,'');
  const after = new Date(Date.now() - settings.days*864e5).toISOString().slice(0,19);
  try{
    const r = await fetch(`${base}/wp-json/wp/v2/posts?per_page=50&after=${after}&_embed=wp:featuredmedia,wp:term&orderby=date&order=desc`, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return (await r.json()).map(p => {
      const media = p._embedded?.['wp:featuredmedia']?.[0];
      const sizes = media?.media_details?.sizes || {};
      const img = (sizes.full||sizes['1536x1536']||sizes.large||{}).source_url || media?.source_url
        || p.yoast_head_json?.og_image?.[0]?.url || p.jetpack_featured_media_url
        || (p.content?.rendered||'').match(/<img[^>]+src=["']([^"']+)["']/)?.[1] || null;
      return {id:String(p.id), title:decode(p.title.rendered), link:p.link, date:p.date, img, categories:(p._embedded?.['wp:term']?.[0]||[]).map(c=>decode(c.name))};
    });
  }catch(e){
    const r = await fetch(`${base}/feed/`, {cache:'no-store'});
    if(!r.ok) throw e;
    const xml = new DOMParser().parseFromString(await r.text(),'text/xml');
    return [...xml.querySelectorAll('item')].map(it=>{
      const html = it.getElementsByTagName('content:encoded')[0]?.textContent || it.querySelector('description')?.textContent || '';
      const img = it.getElementsByTagName('media:content')[0]?.getAttribute('url') || it.querySelector('enclosure')?.getAttribute('url') || (html.match(/<img[^>]+src="([^"]+)"/)||[])[1] || null;
      const guid = it.querySelector('guid')?.textContent || it.querySelector('link')?.textContent;
      return {id:String((guid.match(/[?&]p=(\d+)/)||[])[1] || guid), title:decode(it.querySelector('title')?.textContent||''), link:it.querySelector('link')?.textContent, date:new Date(it.querySelector('pubDate')?.textContent).toISOString(), img, categories:[...it.querySelectorAll('category')].map(c=>c.textContent)};
    }).filter(p => Date.now()-new Date(p.date) < settings.days*864e5);
  }
}

let busy=false;
async function refresh(){
  if(busy) return; busy=true; $('#refreshBtn').classList.add('spin');
  if(!posts.length) $('#feed').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try{
    await sbPull();
    const list = await fetchPosts();
    const firstRun = seen.size===0;
    const prevFresh = new Set(posts.filter(p=>p.isFresh).map(p=>p.id));
    const fresh = list.filter(p => !seen.has(p.id));
    list.forEach(p => { p.a = analyse(p); p.isFresh = (!firstRun && fresh.includes(p)) || prevFresh.has(p.id); });
    posts = list;
    list.forEach(p=>seen.add(p.id)); LS.set('efs_seen', [...seen].slice(-1500));
    lastRefresh = new Date(); updStat();
    if(!firstRun && fresh.length){ toast(fresh.length===1 ? 'Νέο άρθρο: '+fresh[0].title : fresh.length+' νέα άρθρα'); notify(fresh); }
    draw();
  }catch(e){
    $('#stat').textContent = 'Σφάλμα σύνδεσης';
    $('#feed').innerHTML = `<div class="empty"><div class="big">📡</div><b>Δεν διαβάστηκαν άρθρα</b>Από <code>${esc(settings.site)}</code> (${esc(e.message)}). Έλεγξε τη σύνδεση ή το site στις Ρυθμίσεις.</div>`;
  }finally{ busy=false; $('#refreshBtn').classList.remove('spin'); }
}
function updStat(){
  if(!lastRefresh) return;
  const t = lastRefresh.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});
  $('#stat').textContent = `Ενημέρωση ${t}` + (settings.interval ? ` · κάθε ${settings.interval}′` : '');
}
function notify(fresh){
  try{ if('Notification' in window && Notification.permission==='granted'){ const n=new Notification('EurovisionFun · νέο άρθρο',{body:fresh.map(f=>f.title).join('\n'), icon:ASSET_SRC.logo}); n.onclick=()=>window.focus(); } }catch(e){}
}

/* ---------- UI ---------- */
function stOf(p){ const s=state[p.id]||{}; return {status:s.status||'todo', tpl:s.tpl||p.a.tpl, pill:s.pill, title:s.title, y:s.y, zoom:s.zoom}; }
function patch(id, obj, push){
  const cur = Object.assign({}, state[id], obj, {ts:Date.now()});
  for(const k in cur) if(cur[k]===undefined) delete cur[k];
  state[id]=cur; saveState(); if(push) sbPush(id);
}
function ago(d){
  const m = Math.round((Date.now()-new Date(d))/60000);
  if(m<1) return 'μόλις τώρα'; if(m<60) return `πριν ${m}′`;
  const h=Math.round(m/60); if(h<24) return `πριν ${h} ${h===1?'ώρα':'ώρες'}`;
  return new Date(d).toLocaleDateString('el-GR',{day:'numeric',month:'short'});
}
const TABS = [['todo','Νέα'],['posted','Ανέβηκαν'],['hidden','Κρυφά']];
function drawTabs(){
  const c={todo:0,posted:0,hidden:0}; posts.forEach(p=>c[stOf(p).status]++);
  $('#tabs').innerHTML = TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${l}<span class="n">${c[k]}</span></button>`).join('');
  document.title = (c.todo?`(${c.todo}) `:'') + 'EurovisionFun Stories';
}
const isTouch = matchMedia('(pointer:coarse)').matches;
const canShareFiles = (()=>{ try{ return !!(navigator.canShare && navigator.canShare({files:[new File([new Blob(['x'],{type:'image/png'})],'x.png',{type:'image/png'})]})); }catch(e){ return false; } })();

  const fresh = p.isFresh && s.status==='todo';
  const chips = Object.entries(TEMPLATES).map(([k,t])=>`<button class="chip ${k===s.tpl?'on':''}" data-tpl="${k}"><i style="background:${t.dot}"></i>${t.name}${k===p.a.tpl?' <span class="auto">AUTO</span>':''}</button>`).join('');
  const marks = s.status==='todo'
    ? `<button class="gh ok" data-act="posted">${ICON.ok}Ανέβηκε</button><button class="gh" data-act="hidden">${ICON.hide}Απόκρυψη</button>`
    : `<button class="gh" data-act="todo">${ICON.back}Πίσω στα νέα</button>`;
  return `<article class="card ${fresh?'fresh':''}" data-id="${esc(p.id)}">
    <div class="row">
      <button class="thumb" data-act="zoom" aria-label="Μεγέθυνση"><canvas width="1080" height="1920"></canvas><span class="zoom">${ICON.expand}</span></button>
      <div class="info">
        <div class="meta">${fresh?'<span class="new">ΝΕΟ</span>':''}<span class="tag"><i style="background:${T.dot}"></i><span class="tname">${T.name}</span></span><span>·</span><span class="ago">${ago(p.date)}</span></div>
        <h3 class="t">${esc(p.title)}</h3>
        <div class="note" hidden></div>
        <div class="acts"><button class="btn pri" data-act="png">${ICON.dl}Αποθήκευση</button><button class="btn" data-act="link" aria-label="Αντιγραφή link">${ICON.link}Link</button></div>
      </div>
    </div>
    <div class="foot">${marks}<span class="sp"></span><button class="gh" data-act="edit">Επεξεργασία ${ICON.chev}</button><a class="gh" href="${esc(p.link)}" target="_blank" rel="noopener" aria-label="Άνοιγμα άρθρου">${ICON.ext}</a></div>
    <div class="edit">
      <div><label class="lbl">Design</label><div class="chips">${chips}</div></div>
      <div><label class="lbl">Ετικέτα</label><input class="inp" data-f="pill" value="${esc(s.pill ?? T.pill(p.a))}" autocapitalize="characters"></div>

    </div>
  </article>`;
}
function draw(){
  drawTabs();
  const feed = $('#feed');
  const list = posts.filter(p=>stOf(p).status===tab);
  if(!list.length){
    feed.innerHTML = tab==='todo'
      ? '<div class="empty"><div class="big">✨</div><b>Είσαι ενημερωμένος</b>Όλα τα άρθρα έχουν τακτοποιηθεί. Θα εμφανιστούν εδώ μόλις ανέβει κάτι νέο.</div>'
      : `<div class="empty"><b>Τίποτα εδώ</b>${tab==='posted'?'Όσα σημειώνεις ως «Το ανέβασα» μαζεύονται εδώ.':'Όσα κρύβεις μαζεύονται εδώ.'}</div>`;
    return;
  }
  feed.innerHTML = list.map(cardHTML).join('');
  feed.querySelectorAll('.card').forEach(paint);
}
async function paint(card){
  const p = posts.find(x=>x.id===card.dataset.id); if(!p) return;
  const cv = card.querySelector('canvas');
  const note = card.querySelector('.note');
  const say = t => { note.innerHTML = t ? ICON.warn + '<span>'+t+'</span>' : ''; note.hidden = !t; };
  card._photo = null; card._exportable = true;
  render(cv, p, stOf(p), null);
  const man = await manualPhoto(p.id).catch(()=>null);
  if(man){ card._photo = man; render(cv, p, stOf(p), man); say(''); return; }
  if(!p.img){ say('Το άρθρο δεν έχει φωτογραφία. Πρόσθεσε μία από «Επεξεργασία» → «Άλλη φωτογραφία».'); return; }
  try{
    const r = await loadPhoto(p.img);
    card._photo = r.img; card._exportable = r.exportable;
    render(cv, p, stOf(p), r.img);
    say(r.exportable ? '' : 'Η φωτογραφία φαίνεται, αλλά ο browser δεν επιτρέπει να βγει PNG. Βάλε τη από «Επεξεργασία» → «Άλλη φωτογραφία».');
  }catch(e){ say('Η φωτογραφία δεν φορτώθηκε. Πρόσθεσέ τη από «Επεξεργασία» → «Άλλη φωτογραφία».'); }
}
function repaint(card){ const p=posts.find(x=>x.id===card.dataset.id); render(card.querySelector('canvas'), p, stOf(p), card._photo||null); }
const exportBlob = card => new Promise((res,rej)=>{ try{ card.querySelector('canvas').toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'); }catch(e){ rej(e); } });
const fileName = p => 'efun-story-'+p.id+'.png';

document.addEventListener('click', async e=>{
  const tb = e.target.closest('[data-tab]');
  if(tb){ tab=tb.dataset.tab; draw(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const card = e.target.closest('.card'); if(!card) return;
  const p = posts.find(x=>x.id===card.dataset.id); if(!p) return;

  const chip = e.target.closest('[data-tpl]');
  if(chip){
    const v = chip.dataset.tpl;
    patch(p.id, {tpl:v, pill:undefined, title:undefined}, true);
    card.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===chip));
    card.querySelector('.tname').textContent = TEMPLATES[v].name; card.querySelector('.tag i').style.background = TEMPLATES[v].dot;
    card.querySelector('[data-f=pill]').value = TEMPLATES[v].pill(p.a);
    card.querySelector('[data-f=title]').value = defaultTitle(p, v);
    repaint(card); return;
  }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='posted'||act==='hidden'||act==='todo'){
    const prev = stOf(p).status;
    patch(p.id, {status:act}, true);
    card.classList.add('out'); setTimeout(draw, 230);
    toast(act==='posted'?'Σημειώθηκε ως ανεβασμένο':act==='hidden'?'Δεν θα εμφανίζεται':'Επέστρεψε', 'Αναίρεση', ()=>{ patch(p.id,{status:prev},true); draw(); });
  } else if(act==='zoom'){
    try{ const blob = await exportBlob(card); openView(blob, fileName(p)); }
    catch(err){ toast('Η προεπισκόπηση δεν άνοιξε'); }
  } else if(act==='edit'){
    const ed = card.querySelector('.edit'); ed.classList.toggle('open'); b.classList.toggle('on', ed.classList.contains('open'));
  } else if(act==='reset'){
    const keep = state[p.id]?.status; state[p.id] = {status:keep, ts:Date.now()}; saveState(); sbPush(p.id);
    await idbDel('photo:'+p.id); draw();
  } else if(act==='png' || act==='share'){
    if(b.classList.contains('wait')) return;
    b.classList.add('wait');
    try{ await saveStory(card, p, act==='share'); } finally { b.classList.remove('wait'); }
  } else if(act==='link'){
    try{ await navigator.clipboard.writeText(p.link); toast('Το link αντιγράφηκε για το sticker'); }catch(err){ prompt('Link άρθρου:', p.link); }
  }
});
/* Αποθήκευση: κινητό → φύλλο κοινοποίησης (Αποθήκευση εικόνας / Instagram),
   αλλιώς προβολή σε πλήρη οθόνη για παρατεταμένο πάτημα · υπολογιστής → λήψη αρχείου */
let viewBlob = null, viewName = '';
async function saveStory(card, p, viaShare){
  let blob;
  try{ blob = await exportBlob(card); }
  catch(err){ toast('Δεν βγαίνει PNG με αυτή τη φωτογραφία — βάλε τη από «Επεξεργασία»'); return; }
  const name = fileName(p);
  if(isTouch || viaShare){
    if(canShareFiles){
      try{ await navigator.share({files:[new File([blob], name, {type:'image/png'})]}); return; }
      catch(err){ if(err.name==='AbortError') return; }
    }
    return openView(blob, name);
  }
  try{ downloadBlob(blob, name); }catch(e){ openView(blob, name); }
}
function downloadBlob(blob, name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
}
function openView(blob, name){
  viewBlob = blob; viewName = name;
  const r = new FileReader();          // data URL: το παρατεταμένο πάτημα δουλεύει παντού (και σε iOS)
  r.onload = () => { $('#viewImg').src = r.result; $('#view').hidden = false; };
  r.readAsDataURL(blob);
}
$('#viewClose').onclick = () => { $('#view').hidden = true; $('#viewImg').removeAttribute('src'); };
$('#view').addEventListener('click', e => { if(e.target.id==='view') $('#viewClose').click(); });
$('#viewSave').onclick = async () => {
  if(!viewBlob) return;
  if(canShareFiles){ try{ await navigator.share({files:[new File([viewBlob], viewName, {type:'image/png'})]}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ downloadBlob(viewBlob, viewName); }catch(e){ toast('Πάτα παρατεταμένα την εικόνα για αποθήκευση'); }
};

let tmr={};
document.addEventListener('input', e=>{
  const f = e.target.dataset?.f; if(!f) return;
  const card = e.target.closest('.card'); const p = posts.find(x=>x.id===card.dataset.id);
  let v = e.target.value;
  if(f==='y'||f==='zoom') v = parseFloat(v);
  if(f==='pill'){ const pos=e.target.selectionStart; v = capsNoTonos(v); e.target.value=v; try{ e.target.setSelectionRange(pos,pos); }catch(_){} }
  patch(p.id, {[f]:v}, false); repaint(card);
  clearTimeout(tmr[p.id]); tmr[p.id]=setTimeout(()=>sbPush(p.id), 800);
});
document.addEventListener('change', async e=>{
  if(!e.target.matches('[data-photo]')) return;
  const f = e.target.files[0]; if(!f) return;
  const card = e.target.closest('.card');
  await idbSet('photo:'+card.dataset.id, f); paint(card); toast('Η φωτογραφία μπήκε');
});

let toastT;
function toast(msg, btn, fn){
  const t=$('#toast'), b=$('#toastBtn');
  $('#toastMsg').textContent=msg; b.hidden=!btn; b.textContent=btn||''; b.onclick = fn ? ()=>{ fn(); t.classList.remove('on'); } : null;
  t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'), btn?4500:2600);
}

/* ---------- settings ---------- */
const dlg = $('#settings');
$('#legend').innerHTML = [
  ['breaking','«Breaking: …» ή κατηγορία Breaking / Έκτακτο'],
  ['live','«Live: …» ή «ζωντανή ενημέρωση»'],
  ['sfg','«κατέθεσε / δήλωσε συμμετοχή» + «Sing for Greece»'],
  ['exclusive','«Αποκλειστικό: …»'],
  ['interview','«Όνομα: “δήλωση”» — το όνομα πάει στην ετικέτα'],
  ['country','«Χώρα: …» — η χώρα πάει στην ετικέτα'],
  ['classic','όλα τα υπόλοιπα'],
].map(([k,t])=>`<div><i style="background:${TEMPLATES[k].dot}"></i><span><b>${TEMPLATES[k].name}</b> — ${t}</span></div>`).join('');
function sfgPreview(){ const im=$('#sfgPrev'); if(SFG_LOGO){ im.src=SFG_LOGO.src; im.hidden=false; $('#sfgDel').hidden=false; } else { im.hidden=true; $('#sfgDel').hidden=true; } }
$('#settingsBtn').onclick = ()=>{
  $('#sSite').value=settings.site; $('#sDays').value=settings.days; $('#sInterval').value=String(settings.interval);
  $('#sSbUrl').value=settings.sbUrl; $('#sSbKey').value=settings.sbKey; sfgPreview(); dlg.showModal();
};
dlg.addEventListener('click', e=>{ if(e.target===dlg) dlg.close(); });
$('#saveSettings').onclick = ()=>{
  settings = {site:$('#sSite').value.trim()||DEFAULTS.site, days:Math.max(1,parseInt($('#sDays').value)||3), interval:parseInt($('#sInterval').value), sbUrl:$('#sSbUrl').value.trim(), sbKey:$('#sSbKey').value.trim()};
  LS.set('efs_settings', settings); schedule(); refresh();
};
$('#sSfg').onchange = async e=>{
  const f=e.target.files[0]; if(!f) return;
  await idbSet('sfglogo', f); SFG_LOGO = await loadImg(URL.createObjectURL(f), false); sfgPreview(); draw(); toast('Το λογότυπο Sing for Greece μπήκε');
};
$('#sfgDel').onclick = async ()=>{ await idbDel('sfglogo'); SFG_LOGO = SFG_LOGO_EMBED.startsWith('data:') ? await loadImg(SFG_LOGO_EMBED,false) : null; sfgPreview(); draw(); };
$('#notifBtn').onclick = async ()=>{
  if(!('Notification' in window)) return toast('Ο browser δεν υποστηρίζει ειδοποιήσεις');
  const r = await Notification.requestPermission(); toast(r==='granted'?'Θα ειδοποιείσαι όσο το εργαλείο είναι ανοιχτό':'Οι ειδοποιήσεις δεν επιτράπηκαν');
};
$('#refreshBtn').onclick = ()=>refresh();

let iv;
function schedule(){ clearInterval(iv); if(settings.interval>0) iv=setInterval(refresh, settings.interval*60000); updStat(); }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && lastRefresh && Date.now()-lastRefresh > 60000) refresh(); });
setInterval(()=>document.querySelectorAll('.card').forEach(c=>{ const p=posts.find(x=>x.id===c.dataset.id); const s=c.querySelector('.ago'); if(p&&s) s.textContent=ago(p.date); }), 60000);

(async()=>{
  const q = new URLSearchParams(location.search);
  if(q.get('site')) settings.site = q.get('site');
  try{ await document.fonts.load('700 60px "EFS Proxima"','ΑΒΓ abc'); }catch(e){}
  await loadAssets();
  await refresh();
  schedule();
})();
})();
